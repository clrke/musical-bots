<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Musical Bots</title><link rel="icon" href="data:,">
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:system-ui,sans-serif}
canvas{display:block}
#ui{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px}
#ui input{flex:1;padding:8px 12px;border-radius:8px;border:0;font-size:16px}
#ui button{padding:8px 14px;border-radius:8px;border:0;font-size:16px;cursor:pointer}
#live{background:#4f7cff;color:#fff;font-weight:700}
#caption{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);max-width:80%;text-align:center;
 background:rgba(0,0,0,.72);color:#fff;padding:10px 20px;border-radius:10px;font-size:24px;min-height:1.4em}
#caption small{display:block;font-size:14px;opacity:.7;margin-bottom:2px}
body.premiere #ui,body.premiere #status,body.premiere #caption{display:none}
/* ?typing opening: the prompt bar large and centred over the choir, Premiere (or, before a making-of, Make it) pressed at the end */
body.typing #ui{display:flex!important;top:auto;bottom:16%;left:50%;right:auto;transform:translateX(-50%);width:min(76vw,1300px);
 padding:14px;gap:14px;border-radius:22px;background:rgba(14,16,24,.62);box-shadow:0 18px 60px rgba(0,0,0,.45);backdrop-filter:blur(10px)}
body.typing #ui input{font-size:clamp(18px,2.4vw,40px);padding:16px 24px;border-radius:14px;background:#fff;color:#141414}
body.typing #ui button{font-size:clamp(16px,2.1vw,34px);padding:14px 30px;border-radius:14px;transition:transform .12s,background .12s}
body.typing #mute,body.typing:not(.press-live) #live,body.typing.press-live #go{display:none}
body.typing #go,body.typing #live{background:#4f7cff;color:#fff;font-weight:700}
#go.pressed,#live.pressed{transform:scale(.92);background:#2f58d8!important}
/* cinema lower third: the singer's production role */
#role{display:none}
body.premiere #role:not(:empty){display:flex;position:fixed;left:3.2vw;bottom:5.5vh;align-items:center;gap:.7em;
 font:600 clamp(14px,1.7vw,32px)/1.2 system-ui,sans-serif;color:#fff;background:rgba(10,14,24,.62);
 padding:.55em 1.1em .55em .8em;border-radius:1em;box-shadow:0 .4em 1.4em rgba(0,0,0,.35)}
#role .dot{width:.7em;height:.7em;box-shadow:0 0 .6em var(--c,#fff);border-radius:50%;background:var(--c,#fff)}
#role .who{font-weight:800}
#role .job{color:var(--c,#fff);text-transform:uppercase;letter-spacing:.06em;font-size:.82em}
#role .what{opacity:.78;font-weight:500}
body.typing #role{display:none!important}
/* LIVE making-of: the Muse Code director's crew at work (web/src/making-of.js) */
#making{display:none}
/* compact and see-through, at the very top: the crew's back row shows under it (framing.js MAKING_ROOF: the shots keep
   the heads below its 78 px at 1080p) */
body.making-of #making:not(:empty){display:block;position:fixed;top:8px;left:50%;transform:translateX(-50%);max-width:86vw;
 text-align:center;color:#fff;background:rgba(14,16,24,.5);padding:5px 16px 6px;border-radius:10px;font:500 13px/1.3 system-ui,sans-serif;
 white-space:nowrap}
#making b{color:#ffcf5c;letter-spacing:.08em;margin-right:.4em}
#making small{display:block;opacity:.72;font-size:12px}
/* the loading bar: a thin bar filling with the production's time, the beat it is on beside it; an aside under it */
#making .bar{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:4px}
#making .progress{display:block;height:8px;width:min(560px,40vw);border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;flex:none}
#making .progress .fill{display:block;height:100%;background:linear-gradient(90deg,#ffcf5c,#ff9f43);border-radius:4px}
#making .where{display:block;font-size:15px;font-weight:600;letter-spacing:.04em;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#making .aside{display:block;font-size:12.5px;opacity:.85;font-style:italic;margin-top:2px;white-space:normal}
#caption .thinking{display:block;font-size:15px;opacity:.75;margin-top:2px;font-style:italic}
/* the corner caption, sized with the frame (1.5x the old 17/14/19 px at 1080p), low in the corner: under the lyric cards' floor
   (framing.js CARD_FLOOR, 84% down) and left of the middle where the cards hang */
body.making-of #caption{left:2.4vw;bottom:3.6vh;transform:none;max-width:36vw;text-align:left;font-size:clamp(17px,1.33vw,40px);
 padding:.45em .8em;border-radius:.55em;min-height:0}
body.making-of #caption small{font-size:.82em}
body.making-of #caption .thinking{font-size:1.12em;opacity:.95}
body.making-of #caption:empty{display:none}
body.premiere #making{display:none!important}
/* Play: once the episode is ready (a recorded making-of as it plays, a live one once the director is done), it skips the
   rest of the making-of. Bottom right, under the lyric cards' floor (framing.js CARD_FLOOR) and clear of the banner,
   mirroring the corner caption on the left; never in a capture (cinema) or the typed opening */
#play{display:none}
body.making-of #play.ready{display:flex;align-items:center;gap:.5em;position:fixed;right:2.4vw;bottom:3.6vh;z-index:2;
 font:700 clamp(16px,1.25vw,36px)/1 system-ui,sans-serif;color:#fff;background:#4f7cff;border:0;border-radius:.6em;
 padding:.6em 1.1em .6em .95em;cursor:pointer;box-shadow:0 .35em 1.2em rgba(0,0,0,.4);animation:play-in .35s ease-out}
body.making-of #play.ready:hover{background:#3d6af0}
body.making-of #play.ready:active{transform:scale(.95)}
#play:focus-visible{outline:3px solid #ffcf5c;outline-offset:3px}
#play .tri{font-size:.85em}
#play small{font-weight:500;font-size:.72em;opacity:.85}
@keyframes play-in{from{opacity:0;transform:translateY(.4em)}to{opacity:1;transform:none}}
body.cinema #play,body.typing #play,body.premiere #play{display:none!important}
/* a frame-exact capture of the making-of (capture.mjs --makingof): the crew's banner and captions, no controls */
body.cinema #ui,body.cinema #status{display:none}
#status{position:fixed;left:12px;bottom:8px;color:#aaa;font-size:12px}
</style></head>
<body>
<div id="ui"><input id="prompt" placeholder="Describe an episode…" value="Blue brings home the biggest toy box on the street"><button id="live" title="Watch the AI crew sing their thinking as they write it, then the premiere">Make it</button><button id="go" title="Skip to the finished episode">Premiere</button><button id="mute">Mute</button></div>
<div id="caption"></div><div id="role"></div><div id="making"></div><div id="status"></div>
<button id="play" type="button" hidden aria-label="Play the episode now (skip the rest of the making-of)" title="The episode is ready: skip the rest of the making-of"><span class="tri" aria-hidden="true">▶</span>Play <small>the episode is ready</small></button>
<script type="module" src="/src/main.js"></script></body>
</html>
