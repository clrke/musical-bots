# The headless suites (npm test: every web/test-*.mjs, about 2-3 min) and the bundle validator on every
# push and pull request. No secrets, no network beyond npm ci, no browser.
name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run validate
      - run: npm test
      - run: npx vite build
        working-directory: web
